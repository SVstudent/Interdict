<text class="t-title" x="40" y="52">Interdict — vendor-payment fraud interception</text>
<text class="t-sub" x="40" y="80">Twelve Google ADK agents behind a durable case state machine. The payment is frozen <tspan font-weight="700" fill="#14181d">before</tspan> any agent forms an opinion,</text>
<text class="t-sub" x="40" y="100">and released only if independent verification earns it. Every Google Cloud binding sits behind a Protocol carrying its own location.</text>
<text class="t-stack" x="2060" y="42" text-anchor="end">Gemini 3.6 Flash <tspan class="t-stack2">· routine agents</tspan></text>
<text class="t-stack" x="2060" y="62" text-anchor="end">Gemini 3.7 Flash <tspan class="t-stack2">· adversarial tier</tspan></text>
<text class="t-stack" x="2060" y="82" text-anchor="end">Google ADK 2.7.1 <tspan class="t-stack2">· LlmAgent + FunctionTool</tspan></text>
<text class="t-stack" x="2060" y="102" text-anchor="end">Vertex AI <tspan class="t-stack2">· location: global</tspan></text>

<text class="t-b" x="56" y="670">Hidden text, homoglyphs, tool</text>
<text class="t-b" x="56" y="688">poisoning. Removed spans logged</text>
<text class="t-b" x="56" y="706"><tspan class="t-bb">verbatim</tspan> + technique + offset.</text>

<text class="t-b" x="40" y="766">service missed the S2 span; the local</text>
<text class="t-b" x="40" y="784">screen caught it — so it is never the</text>

<rect class="bx" x="320" y="400" width="240" height="124" rx="2"/>
<rect x="320" y="400" width="3" height="124" fill="#a3322a"/>

<text class="t-b" x="336" y="450"><tspan class="t-bb">Freezes every scheduled</tspan></text>
<text class="t-b" x="336" y="468"><tspan class="t-bb">payment,</tspan> then opens the case.</text>
<text class="t-b" x="336" y="486">Makes no legitimacy judgment.</text>
<text class="t-sc" x="336" y="510">✓scan ✓freeze  ✗payments:release</text>

<text class="t-b" x="606" y="470">An attacker-supplied number is a signal, never dialled.</text>

<rect class="bx" x="590" y="506" width="330" height="90" rx="2"/>
<rect x="590" y="506" width="330" height="3" fill="#9a7529"/>
<text class="t-hm" x="606" y="534">ledger</text>
<text class="t-b" x="606" y="556">Tenure, invoice history, prior change frequency,</text>
<text class="t-b" x="606" y="576">open-invoice correlation. Read-only.</text>

<rect class="bx" x="590" y="612" width="330" height="90" rx="2"/>
<rect x="590" y="612" width="330" height="3" fill="#9a7529"/>
<text class="t-hm" x="606" y="640">provenance</text>
<text class="t-b" x="606" y="662">Reply-to divergence, domain age, homoglyphs,</text>
<text class="t-b" x="606" y="682">PDF producer metadata, thread-hijack markers.</text>

<rect class="bx" x="590" y="718" width="330" height="90" rx="2"/>
<rect x="590" y="718" width="330" height="3" fill="#9a7529"/>
<text class="t-hm" x="606" y="746">registry-check</text>
<text class="t-b" x="606" y="768">Account holder vs registered legal entity;</text>
<text class="t-b" x="606" y="788">bank jurisdiction vs operating country.</text>

<text class="t-b" x="590" y="836">A lane that times out becomes a <tspan class="t-bb">recorded gap</tspan>, not a dead case — 45s budget each.</text>

<text class="t-h" x="606" y="882" fill="#8a5410">DORMANT — the runner suspends</text>
<text class="t-b" x="606" y="904">It does not poll and it does not guess.</text>
<text class="t-b" x="606" y="922"><tspan class="t-bb">Silence is never confirmation.</tspan></text>

<rect x="950" y="400" width="3" height="132" fill="#9a7529"/>
<text class="t-hm" x="966" y="426">challenger</text>
<text class="t-b" x="966" y="450">Builds the strongest honest case <tspan class="t-bb">for</tspan></text>
<text class="t-b" x="966" y="468">legitimacy, then rebuts each finding</text>
<text class="t-b" x="966" y="486">individually. <tspan class="t-bb">It must sometimes win.</tspan></text>
<text class="t-sc" x="966" y="512">findings:read only — 1 granted, 6 denied</text>
<path class="ln" marker-end="url(#ah)" d="M1085,532 V556"/>

<rect class="bx" x="950" y="558" width="270" height="92" rx="2"/>

<text class="t-b" x="966" y="608">Does an earlier human resolution</text>
<text class="t-b" x="966" y="626">govern? An argument, not an order.</text>
<path class="ln" marker-end="url(#ah)" d="M1085,650 V674"/>

<rect class="bx" x="950" y="676" width="270" height="110" rx="2"/>
<rect x="950" y="676" width="3" height="110" fill="#9a7529"/>

<text class="t-b" x="966" y="726">Weighs findings against the challenge</text>
<text class="t-b" x="966" y="744">and writes the rationale.</text>
<text class="t-b" x="966" y="768"><tspan class="t-bb">Its outcome is advisory.</tspan></text>

<path class="ln" marker-end="url(#ah)" d="M1220,731 H1234 V594 H1248"/>
<text class="t-edge" x="1242" y="716">proposes</text>

<!-- ───────── C5 RAILS ───────── -->
<rect x="1250" y="400" width="230" height="386" rx="2" fill="#f7f1e2" stroke="#9a7529" stroke-width="1.5"/>
<text class="t-h" x="1266" y="428" fill="#7d5e18">Six deterministic rails</text>
<text class="t-sc" x="1266" y="448">config.py — never in a prompt</text>
<text class="t-rail" x="1266" y="480">1 · Unrebutted <tspan class="t-railb">contradicts</tspan></text>
<text class="t-rail" x="1266" y="498">     ≥0.85 → <tspan class="t-railb">BLOCK</tspan></text>
<text class="t-rail" x="1266" y="526">2 · Callback open, exposure</text>
<text class="t-rail" x="1266" y="544">     &gt; $50,000 → ESCALATE</text>
<text class="t-rail" x="1266" y="572">3 · Support &lt; 0.6 or findings</text>
<text class="t-rail" x="1266" y="590">     in conflict → ESCALATE</text>
<text class="t-rail" x="1266" y="618">4 · RELEASE above $250,000</text>
<text class="t-rail" x="1266" y="636">     ceiling → ESCALATE</text>
<text class="t-rail" x="1266" y="664">5 · RELEASE needs ≥2 agents,</text>
<text class="t-rail" x="1266" y="682">     one a positive callback</text>
<text class="t-rail" x="1266" y="710">6 · Precedent argues last,</text>
<text class="t-rail" x="1266" y="728">     toward caution only</text>
<text class="t-sc" x="1266" y="762">every rail is one-directional</text>

<text class="t-vs" x="1625" y="620" fill="#8a5410" text-anchor="middle">to a named human</text>
<text class="t-vs" x="1625" y="638" fill="#8a5410" text-anchor="middle">abstention is a success state</text>

<rect x="1510" y="676" width="230" height="92" rx="2" fill="#ecf6f2" stroke="#2f7a63" stroke-width="1.5"/>

<text class="t-vs" x="1625" y="756" fill="#256355" text-anchor="middle">only if verification earned it</text>
