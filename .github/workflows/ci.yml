# Every job here runs with NO Google Cloud credentials, on purpose.
#
# The README's central claim is that a reviewer can reproduce the whole demo runbook offline.
# CI is where that claim is checked rather than asserted: DEMO_MODE=replay serves the recorded
# Gemini responses from fixtures/replay_cache.json keyed by prompt hash, and a cache miss raises
# ReplayMiss rather than degrading to a stub — so a prompt edit that would have silently changed
# what the models were asked fails the build instead of shipping.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO_MODE: replay
  PLATFORM_BACKEND: local

jobs:
  backend:
    name: backend — 255 tests, credential-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        # ruff is pinned: an unpinned linter turns a new release into a red build on
        # code nobody touched.
        run: pip install -r backend/requirements.txt ruff==0.16.5

      - name: Lint
        run: ruff check backend scripts

      - name: Test
        run: python -m pytest backend/tests -q

      - name: Schemas have not drifted from the models
        run: python -m pytest backend/tests/test_schema_contract.py -q

  frontend:
    name: frontend — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build

  container:
    name: container — installs from scratch and serves the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The only honest check that this repository installs from a clean clone. It is what
      # caught requirements.txt pinning fastapi below google-adk's floor, which made a fresh
      # `pip install -r` unsatisfiable while the developer's own virtualenv kept working.
      - name: Build
        run: docker build -t interdict:ci .

      - name: Serve a scenario end to end, offline
        run: |
          docker run -d --name interdict -p 8099:8080 -e DEMO_MODE=replay interdict:ci
          for i in $(seq 1 60); do
            curl -fsS localhost:8099/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS localhost:8099/healthz
          curl -fsS -X POST localhost:8099/api/demo/reset -o /dev/null
          # S1 must reach BLOCK from cached model responses alone. `-f` fails the step on a
          # ReplayMiss 503, which is the outcome we want if a prompt changed.
          curl -fsS -X POST localhost:8099/api/demo/inject_scenario/S1 \
            | python3 -c "import sys,json; d=json.load(sys.stdin); \
                          print('outcome:', d['outcome']); \
                          sys.exit(0 if d['outcome']=='BLOCK' else 1)"
      - name: Logs on failure
        if: failure()
        run: docker logs interdict
